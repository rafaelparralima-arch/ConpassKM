<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071a17"><link rel="manifest" href="manifest.json"><title>Contador de Passos</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:linear-gradient(#07111f,#071a17);color:#fff;min-height:100vh;display:grid;place-items:center;padding:18px}.app{width:min(390px,100%);min-height:620px;border:1px solid #ffffff20;background:#ffffff0d;border-radius:32px;padding:28px;display:flex;flex-direction:column;box-shadow:0 24px 70px #0008}.top{color:#ffffffaa;font-weight:650}.main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.icon{font-size:57px;background:#34d39920;border:1px solid #6ee7b740;border-radius:50%;width:110px;height:110px;display:grid;place-items:center}.today{font-size:12px;letter-spacing:.28em;color:#ffffff70;margin-top:24px}.steps{font-size:68px;font-weight:700}.muted{color:#ffffff88}.distance{margin:25px 0 18px;padding:14px 30px;border-radius:18px;background:#6ee7b715;border:1px solid #6ee7b730}.km{font-size:32px;color:#6ee7b7;font-weight:700}.distance small{color:#ffffff78}.slider{width:100%;text-align:left;font-size:13px;color:#ffffff90}.slider input{width:100%;accent-color:#34d399}.status{min-height:40px;color:#ffffff90;font-size:14px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:17px;padding:15px;font-weight:700;font-size:15px}.primary{grid-column:1/3;background:#34d399;color:#07111f}.secondary{background:#ffffff15;color:white}
</style></head><body><div class="app"><div class="top">👣 Caminhada</div><div class="main"><div class="icon">👣</div><div class="today">HOJE</div><div id="steps" class="steps">0</div><div class="muted">passos</div><div class="distance"><div id="km" class="km">0,00 km</div><small>distância estimada</small></div><label class="slider">Comprimento da passada: <b><span id="strideLabel">75</span> cm</b><input id="stride" type="range" min="40" max="120" value="75"></label><p id="status" class="status">Toque em iniciar para contar</p></div><div class="buttons"><button id="start" class="primary">▶ Iniciar</button><button id="test" class="secondary">+1 teste</button><button id="reset" class="secondary">↻ Zerar</button></div></div><script src="app.js"></script></body></html>
